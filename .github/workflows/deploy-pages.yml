name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an older deploy that is still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - id: pages
        uses: actions/configure-pages@v5

      # base_path is "/<repo>" on github.io and "" with a custom domain.
      - name: Export static web build
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}

      - name: Use the not-found page for unknown URLs
        run: cp "dist/+not-found.html" dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
